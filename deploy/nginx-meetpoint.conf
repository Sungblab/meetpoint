# /etc/nginx/sites-available/meetpoint 에 두고 sites-enabled에 링크한다.
# server_name과 포트(8010)를 .env의 PUBLIC_BASE_URL, APP_PORT에 맞춘다.
# 그 다음 `sudo certbot --nginx -d meetpoint.example.com` 으로 HTTPS를 붙인다.

server {
    listen 80;
    server_name meetpoint.example.com;
    # 보안 헤더. location 안에 add_header를 쓰면 이 줄들이 상속되지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 명함 사진 업로드
    client_max_body_size 6m;

    # 실시간 알림(SSE). 버퍼링을 끄고 연결을 오래 유지한다.
    location ~ ^/(r/[A-Za-z0-9]+/api|h/[^/]+)/events$ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 덧붙이지 않고 덮어써서 클라이언트가 IP를 속이지 못하게 한다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
